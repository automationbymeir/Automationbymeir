<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="ad.size" content="width=728,height=90">
    <title>728x90 - Automation by Meir</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        .highlight{background:linear-gradient(90deg,#72FFA3,#34B1FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:600}
        .ad{width:728px;height:90px;background:linear-gradient(90deg,#0c0c0c,#161618 40%,#0f1210);position:relative;overflow:hidden;cursor:pointer;font-family:'IBM Plex Sans',sans-serif}
        .accent-line{position:absolute;bottom:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,#72FFA3,#34B1FF,transparent);opacity:0.6}
        .content{display:flex;align-items:center;padding:0 24px;height:100%;gap:16px;position:relative;z-index:1}
        .logo-icon{width:42px;height:42px;background:rgba(114,255,163,0.08);border:1px solid rgba(114,255,163,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#72FFA3;flex-shrink:0;font-weight:600}
        .text-content{flex:1;min-width:0;overflow:hidden}
        h2{color:#fff;font-size:18px;font-weight:300;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .subtext{color:#888;font-size:11px;margin-top:4px;display:flex;gap:10px;align-items:center}
        .subtext span{display:flex;align-items:center;gap:4px;white-space:nowrap}
        .pip{width:4px;height:4px;background:#72FFA3;border-radius:50%;flex-shrink:0}
        .cta-btn{display:inline-block;background:linear-gradient(135deg,#72FFA3,#4de88a);color:#0a0a0a;font-family:'IBM Plex Sans',sans-serif;font-weight:600;border:none;text-align:center;padding:12px 24px;border-radius:8px;font-size:13px;white-space:nowrap;flex-shrink:0}
    </style>
</head>
<body>
<div class="ad" onclick="window.open(window.clickTag || 'https://automationbymeir.com')">
    <div class="accent-line"></div>
    <div class="content">
        <div class="logo-icon">&lt;/&gt;</div>
        <div class="text-content">
            <h2><span class="highlight">Automate Your Workflow</span> · Save 20+ Hours/Week</h2>
            <div class="subtext">
                <span><span class="pip"></span> 50+ Projects</span>
                <span><span class="pip"></span> 100% Satisfaction</span>
                <span><span class="pip"></span> From $1,200</span>
            </div>
        </div>
        <div class="cta-btn">Start Project →</div>
    </div>
</div>
<script>var clickTag = "https://automationbymeir.com";</script>
</body>
</html>
