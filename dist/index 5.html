<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="ad.size" content="width=336,height=280">
    <title>336x280 - Automation by Meir</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        .highlight{background:linear-gradient(90deg,#72FFA3,#34B1FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:600}
        .ad{width:336px;height:280px;background:linear-gradient(145deg,#0c0c0c,#1a1a1e 50%,#0f1210);position:relative;overflow:hidden;cursor:pointer;font-family:'IBM Plex Sans',sans-serif}
        .content{padding:22px 22px 18px;height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
        .top-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
        h2{color:#fff;font-size:20px;font-weight:300;line-height:1.2}
        .logo-icon{width:30px;height:30px;background:rgba(114,255,163,0.1);border:1px solid rgba(114,255,163,0.2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#72FFA3;flex-shrink:0;font-weight:600}
        .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
        .stat{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);padding:12px 10px;border-radius:10px;text-align:center;display:flex;flex-direction:column;justify-content:center}
        .stat-number{font-size:26px;font-weight:600;background:linear-gradient(90deg,#72FFA3,#34B1FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1}
        .stat-label{font-size:10px;color:#888;margin-top:3px;text-transform:uppercase;letter-spacing:0.5px}
        .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px}
        .tagline{color:#777;font-size:11px;line-height:1.3;flex:1}
        .cta-btn{display:inline-block;background:linear-gradient(135deg,#72FFA3,#4de88a);color:#0a0a0a;font-family:'IBM Plex Sans',sans-serif;font-weight:600;border:none;text-align:center;padding:10px 20px;border-radius:8px;font-size:13px;white-space:nowrap;flex-shrink:0}
    </style>
</head>
<body>
<div class="ad" onclick="window.open(window.clickTag || 'https://automationbymeir.com')">
    <div class="content">
        <div class="top-row">
            <h2><span class="highlight">Real Results</span><br>from Real Clients</h2>
            <div class="logo-icon">&lt;/&gt;</div>
        </div>
        <div class="stat-grid">
            <div class="stat"><div class="stat-number">98%</div><div class="stat-label">Time Saved</div></div>
            <div class="stat"><div class="stat-number">50+</div><div class="stat-label">Projects</div></div>
            <div class="stat"><div class="stat-number">5.0★</div><div class="stat-label">Fiverr Pro</div></div>
            <div class="stat"><div class="stat-number">$1.2K</div><div class="stat-label">Starting At</div></div>
        </div>
        <div class="bottom">
            <div class="tagline">Google Workspace &amp;<br>CRM automation</div>
            <div class="cta-btn">Get Free Plan →</div>
        </div>
    </div>
</div>
<script>var clickTag = "https://automationbymeir.com";</script>
</body>
</html>
