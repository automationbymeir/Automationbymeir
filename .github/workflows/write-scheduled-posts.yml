# Manual one-off: write approved scheduled posts into Firestore.
# Content arrives via the ABM_POSTS_BUNDLE repo secret (never committed; the repo is public).
# Logs show only slugs and field counts, never post content.
name: Write scheduled posts to Firestore (manual)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type WRITE to run"
        required: true
        default: "no"
      collection:
        description: "Firestore collection to write"
        required: true
        default: "blogPosts"
jobs:
  write:
    if: ${{ inputs.confirm == 'WRITE' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix functions
      - name: Write posts
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMATIONBYMEIR }}
          BUNDLE: ${{ secrets.ABM_POSTS_BUNDLE }}
          COLL: ${{ inputs.collection }}
        run: |
          umask 077
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          printf '%s' "$BUNDLE" > "$RUNNER_TEMP/bundle.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" BUNDLE_FILE="$RUNNER_TEMP/bundle.json" node scripts/write-scheduled-posts.mjs
          rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/bundle.json"
