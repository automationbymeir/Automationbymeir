# Manual one-off: copy published Opinly-rendered posts into Firestore + Storage.
# No secrets are written to the repo; the service account comes from GitHub secrets.
name: Import blog posts to Firestore (manual)
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Blog base URL that serves /blog and /blog/<slug>"
        required: true
        default: "https://us-central1-automationbymeir.cloudfunctions.net/blog"
      site:
        description: "Public site origin for canonical URLs"
        required: true
        default: "https://www.automationbymeir.com"
      collection:
        description: "Firestore collection to write"
        required: true
        default: "blogPostsStaging"
      deploy_test_function:
        description: "Deploy ONLY functions:blogTest (no live function, no Hosting)"
        type: boolean
        default: false
      dry_run:
        description: "Parse only, write nothing"
        type: boolean
        default: true
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix functions
      - name: Run import
        env:
          SOURCE: ${{ inputs.source }}
          SITE: ${{ inputs.site }}
          DRY: ${{ inputs.dry_run }}
          COLL: ${{ inputs.collection }}
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMATIONBYMEIR }}
        run: |
          if [ "$DRY" = "true" ]; then
            node scripts/import-opinly-posts.mjs --source "$SOURCE" --site "$SITE" --collection "$COLL" --dry-run
          else
            umask 077
            printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
            GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" node scripts/import-opinly-posts.mjs --source "$SOURCE" --site "$SITE" --collection "$COLL"
            rm -f "$RUNNER_TEMP/sa.json"
          fi
      - name: Write functions env (deploy only)
        if: ${{ inputs.deploy_test_function }}
        run: |
          echo '${{ secrets.ABM_RUNTIME_CONFIG }}' > functions/.runtimeconfig.json
          {
            echo "OPINLY_API_KEY=${{ secrets.OPINLY_API_KEY }}"
            echo "OPINLY_CDN_NAMESPACE=${{ vars.OPINLY_CDN_NAMESPACE }}"
          } > functions/.env
          jq -r '.scheduling | "CALENDAR_ID=\(.calendar_id)\nTIMEZONE=\(.timezone)\nMEETING_DURATION_MINUTES=\(.meeting_duration)\nNOTIFICATION_EMAIL=\(.notification_email)\nDELEGATED_USER=\(.delegated_user)\nBUSINESS_START_HOUR=\(.start_hour)\nBUSINESS_END_HOUR=\(.end_hour)"' functions/.runtimeconfig.json >> functions/.env
      - name: Deploy blogTest only
        if: ${{ inputs.deploy_test_function }}
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions:blogTest --project automationbymeir
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMATIONBYMEIR }}
