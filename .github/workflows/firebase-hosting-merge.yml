# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMATIONBYMEIR }}
          channelId: live
          projectId: automationbymeir
      # Blog function config: OPINLY_API_KEY lives in GitHub secrets, written to
      # functions/.env at deploy time (never committed).
      - name: Write functions env
        run: |
          {
            echo "OPINLY_API_KEY=${{ secrets.OPINLY_API_KEY }}"
            echo "OPINLY_CDN_NAMESPACE=${{ vars.OPINLY_CDN_NAMESPACE }}"
          } > functions/.env
      - name: Deploy functions
        uses: w9jds/firebase-action@main
        with:
          args: deploy --only functions --project automationbymeir
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AUTOMATIONBYMEIR }}
