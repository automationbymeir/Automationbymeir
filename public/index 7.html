<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="ad.size" content="width=970,height=250">
    <title>970x250 - Automation by Meir</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
        *{box-sizing:border-box;margin:0;padding:0}
        .highlight{background:linear-gradient(90deg,#72FFA3,#34B1FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:600}
        .ad{width:970px;height:250px;background:linear-gradient(100deg,#0c0c0c,#161618 50%,#0f1210);position:relative;overflow:hidden;cursor:pointer;font-family:'IBM Plex Sans',sans-serif}
        .glow-l{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(114,255,163,0.06),transparent 70%);bottom:-100px;left:-80px;pointer-events:none}
        .glow-r{position:absolute;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(52,177,255,0.05),transparent 70%);top:-80px;right:200px;pointer-events:none}
        .content{display:flex;align-items:center;padding:0 48px;height:100%;gap:48px;position:relative;z-index:1}
        .left{flex:1}
        .brand-mark{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.5);font-weight:400;margin-bottom:12px}
        .brand-mark .dot{width:6px;height:6px;background:#72FFA3;border-radius:50%}
        h2{color:#fff;font-size:32px;font-weight:300;line-height:1.15;margin-bottom:10px}
        .lead{color:#999;font-size:15px;line-height:1.5;margin-bottom:24px;max-width:400px}
        .cta-row{display:flex;align-items:center;gap:20px}
        .cta-btn{display:inline-block;background:linear-gradient(135deg,#72FFA3,#4de88a);color:#0a0a0a;font-family:'IBM Plex Sans',sans-serif;font-weight:600;border:none;text-align:center;padding:13px 32px;border-radius:10px;font-size:15px}
        .cta-secondary{color:#888;font-size:13px}
        .right{display:flex;gap:12px;flex-shrink:0}
        .mini-stat{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:20px 18px;text-align:center;width:100px}
        .mini-stat .val{font-size:28px;font-weight:600;background:linear-gradient(90deg,#72FFA3,#34B1FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1}
        .mini-stat .lbl{color:#888;font-size:10px;margin-top:6px;text-transform:uppercase;letter-spacing:0.5px}
    </style>
</head>
<body>
<div class="ad" onclick="window.open(window.clickTag || 'https://automationbymeir.com')">
    <div class="glow-l"></div>
    <div class="glow-r"></div>
    <div class="content">
        <div class="left">
            <div class="brand-mark"><span class="dot"></span> Automation by Meir</div>
            <h2>Stop Doing Manually What<br><span class="highlight">AI Can Do in Seconds</span></h2>
            <div class="lead">Custom Google Workspace automation and AI-powered workflows for high-performing teams. Live in 2 weeks.</div>
            <div class="cta-row">
                <div class="cta-btn">Get Free Automation Plan →</div>
                <div class="cta-secondary">From $1,200 · Fixed price</div>
            </div>
        </div>
        <div class="right">
            <div class="mini-stat"><div class="val">98%</div><div class="lbl">Time Saved</div></div>
            <div class="mini-stat"><div class="val">50+</div><div class="lbl">Projects</div></div>
            <div class="mini-stat"><div class="val">5.0</div><div class="lbl">Rating</div></div>
        </div>
    </div>
</div>
<script>var clickTag = "https://automationbymeir.com";</script>
</body>
</html>
